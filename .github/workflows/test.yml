name: Renderer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/brand-pdf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: skills/brand-pdf/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
